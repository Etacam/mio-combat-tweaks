[config]
schemaVersion = "0.0.1"

[package]
namespace = "Etacam"
name = "CombatTweaks"
versionNumber = "0.0.3"
description = "Example mod description"
websiteUrl = "https://github.com/Etacam/mio-combat-tweaks"
containsNsfwContent = false

[package.dependencies]
MIOModding-ModdingAPI = "2.0.3"


[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./build"

[[build.copy]]
source = "./bin/CombatTweaks"
target = "./"


[publish]
repository = "https://thunderstore.io"
communities = [ "mio-memories-in-orbit", ]
[publish.categories]
mio-memories-in-orbit = []


